components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tdl_session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: number
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 24
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details: {}
        issues: {}
      required:
      - error
    UserRole:
      type: string
      enum:
      - buyer
      - seller
      - admin
    UserLevel:
      type: string
      enum:
      - new
      - level1
      - level2
      - top
    GigStatus:
      type: string
      enum:
      - draft
      - active
      - paused
      - rejected
    PackageTier:
      type: string
      enum:
      - basic
      - standard
      - premium
    OrderStatus:
      type: string
      enum:
      - pending
      - active
      - delivered
      - revision
      - completed
      - cancelled
      - disputed
    TransactionType:
      type: string
      enum:
      - charge
      - escrow_release
      - payout
      - refund
      - fee
    DisputeStatus:
      type: string
      enum:
      - open
      - resolved_buyer
      - resolved_seller
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        bio:
          type: string
        country:
          type: string
        languages:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        level:
          $ref: '#/components/schemas/UserLevel'
        createdAt:
          type: string
      required:
      - id
      - email
      - username
      - displayName
      - role
      - languages
      - skills
      - level
      - createdAt
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Bearer token (also set as httpOnly cookie tdl_session)
      required:
      - user
      - token
