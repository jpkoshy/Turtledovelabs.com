openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: Turtledove Labs marketplace API. JSON is camelCase; money is integer cents (USD).
servers:
- url: /api
  description: Base API path
tags:
- name: health
- name: auth
- name: users
- name: categories
- name: gigs
- name: search
- name: orders
- name: reviews
- name: messages
- name: payments
- name: disputes
- name: admin
- name: notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      description: Returns server health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/signup:
    post:
      operationId: signup
      tags:
      - auth
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': &id001
          $ref: '#/components/responses/Error'
        '409': *id001
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': *id001
        '401': *id001
  /auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Log out (clears session cookie)
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Current user
      security: &id002
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401': *id001
  /users/me:
    get:
      operationId: getCurrentUser
      tags:
      - users
      summary: Current user profile
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401': *id001
    patch:
      operationId: updateMe
      tags:
      - users
      summary: Update own profile
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400': *id001
        '401': *id001
  /users/{username}:
    get:
      operationId: getUserByUsername
      tags:
      - users
      summary: Public profile (email only visible to self)
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404': *id001
    patch:
      operationId: updateUserByUsername
      tags:
      - users
      summary: Update a profile by username (self or admin)
      security: *id002
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /categories:
    get:
      operationId: listCategories
      tags:
      - categories
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /gigs/mine:
    get:
      operationId: listMyGigs
      tags:
      - gigs
      summary: List own gigs (all statuses)
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gig'
        '401': *id001
  /gigs:
    post:
      operationId: createGig
      tags:
      - gigs
      summary: Create a gig (seller)
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GigInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /gigs/{idOrSlug}:
    get:
      operationId: getGig
      tags:
      - gigs
      summary: Get gig by slug (public if active; owner/admin any status)
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
        '404': *id001
    patch:
      operationId: updateGig
      tags:
      - gigs
      summary: Update a gig by id (owner/admin)
      security: *id002
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GigUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
    delete:
      operationId: deleteGig
      tags:
      - gigs
      summary: Delete a gig by id (owner/admin)
      security: *id002
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '401': *id001
        '403': *id001
        '404': *id001
  /search/gigs:
    get:
      operationId: searchGigs
      tags:
      - search
      summary: Search active gigs
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: categoryId
        in: query
        schema:
          type: string
      - name: minPriceCents
        in: query
        schema:
          type: number
          minimum: 0
      - name: maxPriceCents
        in: query
        schema:
          type: number
          minimum: 0
      - name: maxDeliveryDays
        in: query
        schema:
          type: number
          minimum: 1
      - name: minRating
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: sellerLevel
        in: query
        schema:
          $ref: '#/components/schemas/UserLevel'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - rating
          - price_asc
          - price_desc
          - newest
          - orders
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigPage'
  /search/suggest:
    get:
      operationId: suggestSearch
      tags:
      - search
      summary: Autocomplete suggestions
      parameters:
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestions'
  /orders:
    get:
      operationId: listOrders
      tags:
      - orders
      summary: List own orders
      security: *id002
      parameters:
      - name: as
        in: query
        schema:
          type: string
          enum:
          - buyer
          - seller
          default: buyer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '401': *id001
    post:
      operationId: createOrder
      tags:
      - orders
      summary: Place an order (buyer; price derived server-side)
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /orders/{id}:
    get:
      operationId: getOrder
      tags:
      - orders
      summary: Get an order (participants/admin)
      security: *id002
      parameters:
      - &id003
        $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401': *id001
        '403': *id001
        '404': *id001
  /orders/{id}/deliver:
    post:
      operationId: deliverOrder
      tags:
      - orders
      summary: Seller delivers work
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /orders/{id}/revision:
    post:
      operationId: requestRevision
      tags:
      - orders
      summary: Buyer requests a revision
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /orders/{id}/complete:
    post:
      operationId: completeOrder
      tags:
      - orders
      summary: Buyer accepts delivery
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '403': *id001
        '404': *id001
        '409': *id001
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags:
      - orders
      summary: Cancel an order
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '403': *id001
        '404': *id001
        '409': *id001
  /reviews:
    get:
      operationId: listReviews
      tags:
      - reviews
      summary: List reviews for a gig
      parameters:
      - name: gigId
        in: query
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400': *id001
    post:
      operationId: createReview
      tags:
      - reviews
      summary: Review a completed order (buyer)
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /reviews/{id}/reply:
    post:
      operationId: replyToReview
      tags:
      - reviews
      summary: Seller replies to a review
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /messages/stream:
    get:
      operationId: streamMessages
      tags:
      - messages
      summary: 'Server-sent events: ''message'' and ''read'' events'
      security: *id002
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        '401': *id001
  /messages/conversations:
    get:
      operationId: listConversations
      tags:
      - messages
      summary: List own conversations
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401': *id001
    post:
      operationId: startConversation
      tags:
      - messages
      summary: Start (or reuse) a conversation
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '400': *id001
        '401': *id001
  /messages/conversations/{id}:
    get:
      operationId: getConversation
      tags:
      - messages
      summary: 'Conversation with a page of messages (query: limit, since, before; not typed here)'
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationThread'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
    post:
      operationId: sendMessage
      tags:
      - messages
      summary: Send a message
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /messages/conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags:
      - messages
      summary: Mark conversation read
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': *id001
        '403': *id001
        '404': *id001
  /payments/charge:
    post:
      operationId: chargeOrder
      tags:
      - payments
      summary: Pay for an order (held in escrow)
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /payments/release/{orderId}:
    post:
      operationId: releaseEscrow
      tags:
      - payments
      summary: Release escrow to seller (buyer/admin)
      security: *id002
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /payments/refund/{orderId}:
    post:
      operationId: refundEscrow
      tags:
      - payments
      summary: Refund escrow to buyer (seller/admin)
      security: *id002
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /payments/transactions:
    get:
      operationId: listTransactions
      tags:
      - payments
      summary: List own transactions
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400': *id001
        '401': *id001
  /payments/balance:
    get:
      operationId: getBalance
      tags:
      - payments
      summary: Seller balance
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401': *id001
  /payments/escrow/{orderId}:
    get:
      operationId: getEscrow
      tags:
      - payments
      summary: Escrow state of an order
      security: *id002
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowInfo'
        '401': *id001
        '403': *id001
        '404': *id001
  /payments/payout:
    post:
      operationId: requestPayout
      tags:
      - payments
      summary: Request a payout (seller)
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': *id001
        '401': *id001
        '409': *id001
  /disputes:
    get:
      operationId: listDisputes
      tags:
      - disputes
      summary: List own disputes (all for admin)
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeList'
        '401': *id001
    post:
      operationId: openDispute
      tags:
      - disputes
      summary: Open a dispute on an order
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /disputes/{id}:
    get:
      operationId: getDispute
      tags:
      - disputes
      summary: Get a dispute
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeEnvelope'
        '401': *id001
        '403': *id001
        '404': *id001
  /disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags:
      - disputes
      summary: Resolve a dispute (admin)
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveDisputeResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /admin/gigs:
    get:
      operationId: adminListGigs
      tags:
      - admin
      summary: List gigs by status for moderation
      security: *id002
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/GigStatus'
      - name: limit
        in: query
        schema:
          type: number
      - name: offset
        in: query
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGigList'
        '401': *id001
        '403': *id001
  /admin/gigs/{id}/moderate:
    post:
      operationId: moderateGig
      tags:
      - admin
      summary: Approve, reject or pause a gig
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateGigInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /admin/users:
    get:
      operationId: adminListUsers
      tags:
      - admin
      summary: List users
      security: *id002
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: limit
        in: query
        schema:
          type: number
      - name: offset
        in: query
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401': *id001
        '403': *id001
  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags:
      - admin
      summary: Suspend or reinstate a user
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /admin/stats:
    get:
      operationId: getAdminStats
      tags:
      - admin
      summary: Platform statistics
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
